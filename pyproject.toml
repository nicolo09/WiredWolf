[project]
name = "wiredwolf"
version = "0.1.0"
description = ""
authors = [
    {name = "Nicolo Guerra",email = "nicolo.guerra@studio.unibo.it"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "zeroconf (>=0.147.0,<0.148.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-flakefinder (>=1.1.0,<2.0.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pygame-gui (>=0.6.14,<0.7.0)",
    "netifaces (>=0.11.0,<0.12.0)",
]

[tool.poetry]
packages = [{include = "wiredwolf", from = "src"}]

# dependencies (Python is a dependency)
[tool.poetry.dependencies]
python = "^3.13.0"

# development dependencies
[tool.poetry.group.dev.dependencies]
poetry = "^2.1.3"
pytest = "^8.1.0"
coverage = "^7.4.0"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"
